<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main>
        <nav class="nav-home">
            <a href="javascript:void(0);" class="hamburger-menu" onclick="toggle()">
                <i class="fa fa-bars"></i>
            </a>
            <a href="" class="logo">CarListings</a>
            <div class="home-links" id="links">
                <a href="">Buy</a>
                <a href="">Sell</a>
                <a href="">Contact</a>
                <a href="">Register</a>
                <a href="">Login</a>
            </div>
        </nav>

        <section class="browse">
            <h2 class="find-ride">FIND YOUR NEXT RIDE</h2>
            <p class="find-text">Find the right vehicle for your journey</p>
            <button class="browse-btn">
                BROWSE ALL VEHICLES
            </button>
            <img src="/html/hilux.jpg" alt="vehicle on sale">
            <div class="caption-text">
                <span>Featured: 2022 Ford Ranger</span>
                <span class="price">KES 2.4M</span>
            </div>
        </section>

        <section class="search">
            <h2>Search Your Preferred Car</h2>
            <p>Filter by certified make, model and vintage</p>
            <div class="search-filter">
                <label for="Make">MAKE</label>
                <div class="select-wrapper">
                    <select name="" id="make">
                        <option value="">Select Make</option>
                    </select>
                </div>
            </div>
            
            <div class="search-filter">
                <label for="Model">MODEL</label>
                <div class="select-wrapper">
                    <select name="" id="make">
                        <option value="">Select Model</option>
                    </select>
                </div>
            </div>

            <div class="search-filter">
                <label for="Year">YEAR</label>
                <div class="select-wrapper">
                    <select name="" id="make">
                        <option value="">Select Model</option>
                    </select>
                </div>
            </div>

            <button class="matches-btn">FIND MATCHES</button>
                <!-- <form action="">
                    <input type="text" placeholder="Search your preferred car" name="search">
                    <button type="submit"><i class="fa fa-search"></i></button>
                 </form> -->
            <!-- </div>
            <div class="filters">
                <button class="make-btn">Make</button>
                <button class="model-btn">Model</button>
                <button class="year-btn">Year</button> -->
        </section>
        
    </main>
    <script>
        function toggle() {
        let x = document.getElementById("links");
        if (x.style.display === "block") {
            x.style.display = "none";
        } else {
            x.style.display = "block";
        }
        }
    </script>
</body>
</html>
